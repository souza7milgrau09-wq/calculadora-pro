<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Científica Pro</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body onload="checkLogin(); initApp();">

<div class="container">

<div class="top-bar">
<span id="welcome"></span>
<button onclick="logout()">Sair</button>
</div>

<div class="calculator">

<div class="top-controls">
<button onclick="toggleTheme()">🌙</button>
<button onclick="toggleAngle()" id="angleMode">DEG</button>
</div>

<div class="display">
<input type="text" id="result" disabled>
</div>

<div class="buttons">

<button onclick="appendValue('sin(')" class="scientific">sin</button>
<button onclick="appendValue('cos(')" class="scientific">cos</button>
<button onclick="appendValue('tan(')" class="scientific">tan</button>
<button onclick="appendValue('√(')" class="scientific">√</button>

<button onclick="clearDisplay()" class="operator">C</button>
<button onclick="deleteLast()" class="operator">DEL</button>
<button onclick="appendValue('/')" class="operator">÷</button>
<button onclick="appendValue('*')" class="operator">×</button>

<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button onclick="appendValue('-')" class="operator">−</button>

<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button onclick="appendValue('+')" class="operator">+</button>

<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button onclick="appendValue('.')">.</button>

<button onclick="appendValue('0')" class="zero">0</button>
<button onclick="calculate()" class="equal">=</button>

</div>

<div class="history">
<h3>Histórico</h3>
<ul id="historyList"></ul>
</div>

</div>

<footer>
© 2026 Daniel. Todos os direitos reservados.
</footer>

</div>

<script src="auth.js"></script>
<script src="db.js"></script>
<script src="script.js"></script>

</body>
</html>
